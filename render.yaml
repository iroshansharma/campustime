# ==============================================================================
# CampusTime — Render Infrastructure Blueprint Spec
# Deploy Django REST Framework backend on Render free tier.
# ==============================================================================
services:
  - type: web
    name: campustime-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn campustime.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SCHEDULER_TIMEOUT_SECONDS
        value: "60"
      - key: SCHEDULER_MAX_BACKTRACK_STEPS
        value: "50000"
